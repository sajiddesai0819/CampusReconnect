services:
  - type: web
    name: campus-reconnect
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-reconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HF_TOKEN
        sync: false # User needs to enter their Hugging Face API key in Render settings
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false # User needs to enter their email address
      - key: EMAIL_PASS
        sync: false # User needs to enter their email App Password

databases:
  - name: campus-reconnect-db
    plan: free
